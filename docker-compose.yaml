services:
  sysmic-cpu:
    build:
      context: .
    image: sysmic
    container_name: sysmic
    profiles:
      - cpu
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    ipc: host
    environment:
      - DISPLAY=${DISPLAY:-}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/tmp/.Xauthority}:/root/.Xauthority
      - ./src/sysmic_rl/models:/sysmic_ws/src/sysmic_rl/models
  sysmic-gpu:
    build:
      context: .
    image: sysmic
    container_name: sysmic
    profiles:
      - gpu
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    ipc: host
    environment:
      - DISPLAY=${DISPLAY:-}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/tmp/.Xauthority}:/root/.Xauthority
      - ./src/sysmic_rl/models:/sysmic_ws/src/sysmic_rl/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]